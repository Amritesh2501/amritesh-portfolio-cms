<!--
  Default site icon. Next serves this at /icon.svg and injects the <link>, so
  browsers stop falling back to a bare /favicon.ico request.

  This is the fallback brand mark, not content: uploading an image in
  Admin > Media and setting it as Admin > SEO > Favicon overrides it, because
  generateMetadata only leaves the file-based icon in place when that setting
  is empty.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#f5f5f7" />
  <text
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-1.5"
    fill="#060607"
  >AT</text>
</svg>
